# Starting point only. Egress Lab ships a utility policy and does not train this.
# Install the ML-Agents Python package separately, then point it at a Unity
# build that exposes the observations documented in docs/ML_AGENTS.md.
behaviors:
  EgressRouting:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 500000
    time_horizon: 128
    summary_freq: 10000
